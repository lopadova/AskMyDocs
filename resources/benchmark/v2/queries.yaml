# AskMyDocs retrieval-quality benchmark v2 — labelled query set.
#
# v1 (resources/benchmark/queries.yaml) is saturated (nDCG@5 ~0.997). v2 is a
# bigger, adversarial set designed so that a weak retriever can actually FAIL:
# paraphrases with no shared vocabulary, hard negatives (superseded / deprecated
# siblings that reuse the accepted doc's wording), exact identifiers, chunks
# whose meaning depends on their heading, 1-3 word queries, source code, and
# questions the corpus cannot answer.
#
# The benchmark runner ingests resources/benchmark/v2/corpus/* (flat dir) and
# scores each query through the SAME searchWithContext() path the chat uses.
#
# Doc keys = source_path basename WITHOUT extension (unique across extensions):
#   billing & refunds
#     refund-policy | refund-policy-2023 (superseded) | vat-rounding-standard
#     rejected-per-line-vat-rounding | billing-faq | finance-meeting-notes-2026-05
#     invoice-calculator (php) | refund-service (php)
#   order fulfilment
#     order-lifecycle-concept | shipment-labels-api | spedizioni-faq-clienti
#     incident-2026-04-label-outage | route-optimizer (ts)
#   warehouse operations
#     reservation-ttl-decision | magazzino-milano-howto | magazzino-bologna-howto
#     scanner-error-codes | stock-reservation (php)
#   customer support
#     support-macros-guide | support-faq-resi-clienti
#   HR policies
#     ferie-e-permessi-policy | remote-work-policy
#   security / access
#     access-password-standard | access-password-legacy (deprecated)
#     vpn-access-howto
#   API platform
#     api-rate-limits | api-rate-limits-2022 (superseded) | webhook-signing-standard
#     rejected-polling-webhooks | api-changelog-2026 | api-key-management-howto
#     sandbox-environment-guide | webhook-signature (ts)
#   data retention
#     data-retention-policy | retention-sweeper (py)
#   incident response
#     incident-escalation-runbook | oncall-handover-notes
#   release engineering
#     release-train-decision | release-notes-2026-q3 | rollback-howto
#
# Binary fixtures (generated by `php artisan kb:make-benchmark-fixtures --suite=v2`):
#   incident response   incident-postmortem-db (pdf)
#   HR policies         hr-handbook-extract (docx)
#
# Per query:
#   class          paraphrase | hard_negative | identifier | context_dependent |
#                  short_ambiguous | code | refusal  (used for per-class metrics).
#   lang           it | en  (language of the QUERY; some are deliberately
#                  cross-lingual, e.g. an Italian question about an English doc).
#   relevance      map of doc-key => graded relevance (0..3; omit = irrelevant).
#                  Drives nDCG@k / precision@k / MRR. In hard_negative queries the
#                  superseded / deprecated / look-alike doc is OMITTED (= 0).
#   expect_citation the doc that MUST appear in the answer's citations.
#   expect_related  docs that should surface via graph expansion (kb_edges).
#   expect_rejected rejected-approach docs that should be injected (⚠ block).
#   expect_refusal  true => the system MUST refuse (no grounded answer).
#
# Enterprise pass thresholds (aggregate): nDCG@5 >= 0.80, MRR >= 0.85,
# citation-precision >= 0.90, refusal-accuracy >= 0.95. Expect v2 to score well
# below v1 on paraphrase / hard_negative / short_ambiguous until retrieval improves.

