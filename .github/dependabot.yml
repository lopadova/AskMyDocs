version: 2

# Automated dependency-update PRs + security advisories (SEC-DEPS-001,
# supply-chain-ci). Dependabot opens grouped weekly PRs for Composer, npm and
# the GitHub Actions we pin, and immediate PRs for security advisories. Each PR
# still goes through the normal CI + review gate before merge.
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Keeps third-party Actions pinned to reviewed, up-to-date commits
  # (SEC-CI-PERM-001 / supply-chain-ci: immutable, reviewed action refs).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
